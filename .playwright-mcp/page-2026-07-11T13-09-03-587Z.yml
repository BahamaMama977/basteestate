      - generic [ref=f2e21]: Застройщикам
      - heading "Продавайте объекты не одним риэлтором, а всеми" [level=1] [ref=f2e22]:
        - text: Продавайте объекты
        - generic [ref=f2e23]: не одним риэлтором, а всеми
      - paragraph [ref=f2e24]: Опубликуйте дома и подряды, задайте акции и вознаграждение — и объекты берут в работу все риэлторы платформы. Обращения, команда и сделки — в одном приложении.
    - generic [ref=f2e26]:
      - paragraph [ref=f2e28]: "Скрольте — путь застройщика: от публикации объявления до широкого канала сбыта."
      - generic [ref=f2e30]:
        - generic [ref=f2e31]:
          - article [ref=f2e32]:
            - paragraph [ref=f2e33]: Шаг 01 · Каталог
            - heading "Опубликуйте готовый дом или подряд" [level=3] [ref=f2e34]
            - paragraph [ref=f2e35]: "Мастер ведёт по шагам: характеристики, фото, планировки и 3D, материалы стен для подряда. Черновик сохраняется сам."
          - article [ref=f2e36]:
            - paragraph [ref=f2e37]: Шаг 02 · Акции
            - heading "Одна акция — сразу на несколько объявлений" [level=3] [ref=f2e38]
            - paragraph [ref=f2e39]: Создайте акцию — скидку или подарок — и примените её сразу к нескольким объектам. Покупатель и риэлтор видят её в карточке ещё до сделки.
          - article [ref=f2e40]:
            - paragraph [ref=f2e41]: Шаг 03 · Команда
            - heading "Соберите отдел продаж в приложении" [level=3] [ref=f2e42]
            - paragraph [ref=f2e43]: Пригласите сотрудников, назначьте владельца объявления и контактное лицо — обращение приходит тому, кто за объект отвечает.
          - article [ref=f2e44]:
            - paragraph [ref=f2e45]: Шаг 04 · Обращения
            - heading "Вопрос приходит прямо из карточки объекта" [level=3] [ref=f2e46]
            - paragraph [ref=f2e47]: Сразу видно, о каком доме речь и кто смотрел объект. Ответственный ведёт диалог в чате с полной историей.
          - article [ref=f2e48]:
            - paragraph [ref=f2e49]: Шаг 05 · Сделка
            - heading "Доведите сделку до договора" [level=3] [ref=f2e50]
            - paragraph [ref=f2e51]: "Этапы, участники и документы — в одной сделке. Авторство риэлтора закреплено: спор «чей клиент» закрыт до его начала."
          - article [ref=f2e52]:
            - paragraph [ref=f2e53]: Шаг 06 · Канал сбыта
            - heading "Ваши объекты продают все риэлторы платформы" [level=3] [ref=f2e54]
            - paragraph [ref=f2e55]: "Не один-два партнёра, а все риэлторы «БАСТ»: они видят объявление и берут его в работу без предварительной договорённости — условия партнёрства и вознаграждение заданы в объявлении заранее. Просмотры, закрепления и репосты видны по каждому объекту."
