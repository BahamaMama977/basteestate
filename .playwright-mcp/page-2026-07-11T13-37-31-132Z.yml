      - generic [ref=f9e20]: Риэлторам
      - heading "Ведите клиентов и сделки с телефона" [level=1] [ref=f9e21]:
        - text: Ведите клиентов и сделки
        - generic [ref=f9e22]: с телефона
      - paragraph [ref=f9e23]: Клиент закреплён за вами, авторство сохраняется в сделке, бонусы считаются прозрачно — весь путь риэлтора в приложении.
    - generic [ref=f9e25]:
      - paragraph [ref=f9e27]: "Скрольте — путь риэлтора: от заявки стать риэлтором до прозрачных бонусов за приведённого клиента."
      - generic [ref=f9e29]:
        - generic [ref=f9e30]:
          - article [ref=f9e31]:
            - paragraph [ref=f9e32]: Шаг 01 · Старт
            - heading "Станьте риэлтором в приложении" [level=3] [ref=f9e33]
            - paragraph [ref=f9e34]: Заявка «Стать риэлтором» из профиля. После одобрения — доступ к клиентам, сделкам, акциям и команде.
          - article [ref=f9e35]:
            - paragraph [ref=f9e36]: Шаг 02 · Каталог
            - heading "Объекты застройщиков и ваши объявления" [level=3] [ref=f9e37]
            - paragraph [ref=f9e38]: Берите в работу объекты застройщиков и ведите свои — карта, каталог, фильтры и счётчики просмотров.
          - article [ref=f9e39]:
            - paragraph [ref=f9e40]: Шаг 03 · Клиент закреплён
            - heading "Клиент закрепляется по вашей ссылке" [level=3] [ref=f9e41]
            - paragraph [ref=f9e42]: Поделитесь объектом персональной ссылкой или QR на показе. Клиент открывает — и закрепляется за вами. Авторство сохраняется в сделке.
          - article [ref=f9e43]:
            - paragraph [ref=f9e44]: Шаг 04 · Работа
            - heading "Ведите клиента в совместном пространстве" [level=3] [ref=f9e45]
            - paragraph [ref=f9e46]: Закреплённые объекты, переписка, напоминания и этапы сделки — в одном рабочем пространстве по каждому клиенту.
          - article [ref=f9e47]:
            - paragraph [ref=f9e48]: Шаг 05 · Сделка
            - heading "Сделка с сохранённым авторством" [level=3] [ref=f9e49]
            - paragraph [ref=f9e50]: Ведите сделку по этапам. Авторство закреплено — спор «чей клиент» закрыт до его начала.
          - article [ref=f9e51]:
            - paragraph [ref=f9e52]: Шаг 06 · Бонусы
            - heading "Прозрачные бонусы за приведённого клиента" [level=3] [ref=f9e53]
            - paragraph [ref=f9e54]: Бонус привязан к сделке и считается прозрачно. Партнёрские сертификаты и акции видны по каждому объекту.
