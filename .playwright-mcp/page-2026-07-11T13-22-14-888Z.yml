  - main [ref=f3e17]:
    - generic [ref=f3e20]:
      - generic [ref=f3e21]: Инвесторам
      - heading "Инфраструктура загородной сделки" [level=1] [ref=f3e22]:
        - text: Инфраструктура
        - generic [ref=f3e23]: загородной сделки
      - paragraph [ref=f3e24]: Одна платформа связывает покупателей, риэлторов и застройщиков — от поиска объекта до подписания договора. Приложение работает и развивается на рынке, где единой системы пока не сложилось.
    - generic [ref=f3e26]:
      - paragraph [ref=f3e28]: "Скрольте — инвест-история: как устроен рынок, что уже работает, на чём платформа зарабатывает и куда растёт."
      - generic [ref=f3e30]:
        - generic [ref=f3e31]:
          - article [ref=f3e32]:
            - paragraph [ref=f3e33]: Шаг 01 · Рынок
            - heading "Сегодня рынок загородной недвижимости живёт разрозненно" [level=3] [ref=f3e34]
            - paragraph [ref=f3e35]: "Так сложилось: объект, переписка, документы и промо застройщика существуют в разных каналах. Про акции нередко не знают ни риэлтор, ни покупатель, авторство сделки теряется, часть сделок не доходит до договора. Это описание ситуации — и место, где появляется платформа."
          - article [ref=f3e36]:
            - paragraph [ref=f3e37]: Шаг 02 · Продукт
            - heading "Приложение уже работает, а не проектируется" [level=3] [ref=f3e38]
            - paragraph [ref=f3e39]: «БАСТ» — маркетплейс объектов на карте, встроенная CRM для риэлторов и застройщиков, привязка клиента ссылкой или QR с сохранением авторства и сквозная сделка до подписания документов. Приложение доступно в App Store и Google Play.
          - article [ref=f3e40]:
            - paragraph [ref=f3e41]: Шаг 03 · Выручка
            - heading "Четыре источника выручки на одной платформе" [level=3] [ref=f3e42]
            - paragraph [ref=f3e43]: Платформа зарабатывает на профессиональных участниках рынка — для покупателя приложение бесплатно, сделку сопровождают без комиссии с него. Юнит-экономику и разбивку выручки передаём в финансовой модели.
          - article [ref=f3e44]:
            - paragraph [ref=f3e45]: Шаг 04 · Момент
            - heading "Почему это работает именно сейчас" [level=3] [ref=f3e46]
            - paragraph [ref=f3e47]: Спрос на загородную жизнь высок, сделка и общение уходят в телефон, а единого инфраструктурного слоя для загорода не сложилось — ниша открыта.
          - article [ref=f3e48]:
            - paragraph [ref=f3e49]: Шаг 05 · Рост
            - heading "Куда растёт платформа" [level=3] [ref=f3e50]
            - paragraph [ref=f3e51]: Развитие идёт от работающего ядра — направления без привязки к датам.
          - article [ref=f3e52]:
            - paragraph [ref=f3e53]: Шаг 06 · Материалы
            - heading "Цифры и модель — в материалах по запросу" [level=3] [ref=f3e54]
            - paragraph [ref=f3e55]: "Тракшн, юнит-экономику и финансовую модель мы не публикуем на сайте: передаём инвесторам в материалах. Напишите — направим Pitch Deck и финансовую модель."
