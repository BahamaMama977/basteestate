      - generic [ref=f4e21]: Риэлторам
      - heading "Ведите клиентов и сделки с телефона" [level=1] [ref=f4e22]:
        - text: Ведите клиентов и сделки
        - generic [ref=f4e23]: с телефона
      - paragraph [ref=f4e24]: Клиент закреплён за вами, авторство сохраняется в сделке, бонусы считаются прозрачно — весь путь риэлтора в приложении.
    - generic [ref=f4e26]:
      - paragraph [ref=f4e28]: "Скрольте — путь риэлтора: от заявки стать риэлтором до прозрачных бонусов за приведённого клиента."
      - generic [ref=f4e30]:
        - generic [ref=f4e31]:
          - article [ref=f4e32]:
            - paragraph [ref=f4e33]: Шаг 01 · Старт
            - heading "Станьте риэлтором в приложении" [level=3] [ref=f4e34]
            - paragraph [ref=f4e35]: Заявка «Стать риэлтором» из профиля. После одобрения — доступ к клиентам, сделкам, акциям и команде.
          - article [ref=f4e36]:
            - paragraph [ref=f4e37]: Шаг 02 · Каталог
            - heading "Объекты застройщиков и ваши объявления" [level=3] [ref=f4e38]
            - paragraph [ref=f4e39]: Берите в работу объекты застройщиков и ведите свои — карта, каталог, фильтры и счётчики просмотров.
          - article [ref=f4e40]:
            - paragraph [ref=f4e41]: Шаг 03 · Клиент закреплён
            - heading "Клиент закрепляется по вашей ссылке" [level=3] [ref=f4e42]
            - paragraph [ref=f4e43]: Поделитесь объектом персональной ссылкой или QR на показе. Клиент открывает — и закрепляется за вами. Авторство сохраняется в сделке.
          - article [ref=f4e44]:
            - paragraph [ref=f4e45]: Шаг 04 · Работа
            - heading "Ведите клиента в совместном пространстве" [level=3] [ref=f4e46]
            - paragraph [ref=f4e47]: Закреплённые объекты, переписка, напоминания и этапы сделки — в одном рабочем пространстве по каждому клиенту.
          - article [ref=f4e48]:
            - paragraph [ref=f4e49]: Шаг 05 · Сделка
            - heading "Сделка с сохранённым авторством" [level=3] [ref=f4e50]
            - paragraph [ref=f4e51]: Ведите сделку по этапам. Авторство закреплено — спор «чей клиент» закрыт до его начала.
          - article [ref=f4e52]:
            - paragraph [ref=f4e53]: Шаг 06 · Бонусы
            - heading "Прозрачные бонусы за приведённого клиента" [level=3] [ref=f4e54]
            - paragraph [ref=f4e55]: Бонус привязан к сделке и считается прозрачно. Партнёрские сертификаты и акции видны по каждому объекту.
