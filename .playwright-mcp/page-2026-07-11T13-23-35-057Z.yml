        - article [ref=f6e121]:
          - paragraph [ref=f6e122]: Шаг 03 · Выручка
          - heading "Четыре источника выручки на одной платформе" [level=3] [ref=f6e123]
          - paragraph [ref=f6e124]: Платформа зарабатывает на профессиональных участниках рынка — для покупателя приложение бесплатно, сделку сопровождают без комиссии с него. Юнит-экономику и разбивку выручки передаём в финансовой модели.
          - generic [ref=f6e126]:
            - generic [ref=f6e127]:
              - text: "01"
              - paragraph [ref=f6e128]: SaaS-подписки
              - paragraph [ref=f6e129]: "Агентства и застройщики платят за рабочее пространство: CRM, объявления, команда, статистика."
            - generic [ref=f6e130]:
              - text: "02"
              - paragraph [ref=f6e131]: Комиссии со сделок
              - paragraph [ref=f6e132]: Платформа участвует в сделках, доведённых до договора.
            - generic [ref=f6e133]:
              - text: "03"
              - paragraph [ref=f6e134]: Партнёрские программы
              - paragraph [ref=f6e135]: "Сертификаты и предложения партнёров вокруг сделки: ремонт, обустройство, товары для дома."
            - generic [ref=f6e136]:
              - text: "04"
              - paragraph [ref=f6e137]: Реклама
              - paragraph [ref=f6e138]: Размещения, смежные со строительством, ремонтом и благоустройством, с таргетом на загородную аудиторию.
        - article [ref=f6e139]:
          - paragraph [ref=f6e140]: Шаг 04 · Момент
          - heading "Почему это работает именно сейчас" [level=3] [ref=f6e141]
          - paragraph [ref=f6e142]: Спрос на загородную жизнь высок, сделка и общение уходят в телефон, а единого инфраструктурного слоя для загорода не сложилось — ниша открыта.
          - generic [ref=f6e144]:
            - generic [ref=f6e145]:
              - text: "01"
              - paragraph [ref=f6e146]: Спрос на загород
              - paragraph [ref=f6e147]: Интерес к загородной жизни устойчиво высок.
            - generic [ref=f6e148]:
              - text: "02"
              - paragraph [ref=f6e149]: Мобильное поведение
              - paragraph [ref=f6e150]: Общение и оформление уходят в телефон; QR и приложения привычны.
            - generic [ref=f6e151]:
              - text: "03"
              - paragraph [ref=f6e152]: Нет инфраструктурного слоя
              - paragraph [ref=f6e153]: Единой системы «объект → сделка → договор» для загорода не сложилось.
        - article [ref=f6e154]:
          - paragraph [ref=f6e155]: Шаг 05 · Рост
          - heading "Куда растёт платформа" [level=3] [ref=f6e156]
          - paragraph [ref=f6e157]: Развитие идёт от работающего ядра — направления без привязки к датам.
          - generic [ref=f6e159]:
            - generic [ref=f6e160]:
              - text: "01"
              - paragraph [ref=f6e161]: Партнёрство с банками
              - paragraph [ref=f6e162]: "В планах: льготная ипотека покупателям и финансирование застройщиков-партнёров — польза пользователям и новый источник комиссий."
            - generic [ref=f6e163]:
              - text: "02"
              - paragraph [ref=f6e164]: Новые регионы
              - paragraph [ref=f6e165]: Архитектура позволяет подключать продавцов и агентства за пределами Удмуртии.
            - generic [ref=f6e166]:
              - text: "03"
              - paragraph [ref=f6e167]: Веб-каталог
              - paragraph [ref=f6e168]: Сейчас каталог живёт в приложении, следующий шаг — веб.
            - generic [ref=f6e169]:
              - text: "04"
              - paragraph [ref=f6e170]: Персональные подборки
              - paragraph [ref=f6e171]: Автоматический подбор объектов под запрос покупателя.
        - article [ref=f6e172]:
          - paragraph [ref=f6e173]: Шаг 06 · Материалы
          - heading "Цифры и модель — в материалах по запросу" [level=3] [ref=f6e174]
          - paragraph [ref=f6e175]: "Тракшн, юнит-экономику и финансовую модель мы не публикуем на сайте: передаём инвесторам в материалах. Напишите — направим Pitch Deck и финансовую модель."
          - generic [ref=f6e177]:
            - generic [ref=f6e178]:
              - text: "01"
              - paragraph [ref=f6e179]: Pitch Deck
              - paragraph [ref=f6e180]: Продукт, рынок, модель, команда, планы развития.
            - generic [ref=f6e181]:
              - text: "02"
              - paragraph [ref=f6e182]: Financial Model
              - paragraph [ref=f6e183]: Выручка, юнит-экономика, сценарии роста.
