    - generic [ref=f6e14]:
      - generic [ref=f6e15]: Инвесторам
      - heading "Инфраструктура загородной сделки" [level=1] [ref=f6e16]:
        - text: Инфраструктура
        - generic [ref=f6e17]: загородной сделки
      - paragraph [ref=f6e18]: Одна платформа связывает покупателей, риэлторов и застройщиков — от поиска объекта до подписания договора. Приложение работает и развивается на рынке, где единой системы пока не сложилось.
    - generic [ref=f6e20]:
      - paragraph [ref=f6e22]: "Скрольте — инвест-история: как устроен рынок, что уже работает, на чём платформа зарабатывает и куда растёт."
      - generic [ref=f6e25]:
        - article [ref=f6e26]:
          - paragraph [ref=f6e27]: Шаг 01 · Рынок
          - heading "Сегодня рынок загородной недвижимости живёт разрозненно" [level=3] [ref=f6e28]
          - paragraph [ref=f6e29]: "Так сложилось: объект, переписка, документы и промо застройщика существуют в разных каналах. Про акции нередко не знают ни риэлтор, ни покупатель, авторство сделки теряется, часть сделок не доходит до договора. Это описание ситуации — и место, где появляется платформа."
          - generic [ref=f6e31]:
            - generic [ref=f6e32]:
              - text: "01"
              - paragraph [ref=f6e33]: Разрозненные каналы промо
              - paragraph [ref=f6e34]: Застройщик запускает акцию, но риэлтор о ней не знает и не может ускорить продажу. Мелкие застройщики каналами продвижения почти не пользуются.
            - generic [ref=f6e35]:
              - text: "02"
              - paragraph [ref=f6e36]: Споры об авторстве
              - paragraph [ref=f6e37]: "Непонятно, кто привёл клиента: риэлтор рискует, что его исключат из сделки, застройщик — что партнёр уйдёт."
            - generic [ref=f6e38]:
              - text: "03"
              - paragraph [ref=f6e39]: Сделка теряется по пути
              - paragraph [ref=f6e40]: Без единого контура «объект → диалог → сделка → договор» часть сделок не доходит до подписания.
        - article [ref=f6e41]:
          - paragraph [ref=f6e42]: Шаг 02 · Продукт
          - heading "Приложение уже работает, а не проектируется" [level=3] [ref=f6e43]
          - paragraph [ref=f6e44]: «БАСТ» — маркетплейс объектов на карте, встроенная CRM для риэлторов и застройщиков, привязка клиента ссылкой или QR с сохранением авторства и сквозная сделка до подписания документов. Приложение доступно в App Store и Google Play.
