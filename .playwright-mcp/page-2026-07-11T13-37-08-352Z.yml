      - generic [ref=f7e20]: Застройщикам
      - heading "Продавайте объекты не одним риэлтором, а всеми" [level=1] [ref=f7e21]:
        - text: Продавайте объекты
        - generic [ref=f7e22]: не одним риэлтором, а всеми
      - paragraph [ref=f7e23]: Опубликуйте дома и подряды, задайте акции и вознаграждение — и объекты берут в работу все риэлторы платформы. Обращения, команда и сделки — в одном приложении.
    - generic [ref=f7e25]:
      - paragraph [ref=f7e27]: "Скрольте — путь застройщика: от публикации объявления до широкого канала сбыта."
      - generic [ref=f7e29]:
        - generic [ref=f7e30]:
          - article [ref=f7e31]:
            - paragraph [ref=f7e32]: Шаг 01 · Каталог
            - heading "Опубликуйте готовый дом или подряд" [level=3] [ref=f7e33]
            - paragraph [ref=f7e34]: "Мастер ведёт по шагам: характеристики, фото, планировки и 3D, материалы стен для подряда. Черновик сохраняется сам."
          - article [ref=f7e35]:
            - paragraph [ref=f7e36]: Шаг 02 · Акции
            - heading "Одна акция — сразу на несколько объявлений" [level=3] [ref=f7e37]
            - paragraph [ref=f7e38]: Создайте акцию — скидку или подарок — и примените её сразу к нескольким объектам. Покупатель и риэлтор видят её в карточке ещё до сделки.
          - article [ref=f7e39]:
            - paragraph [ref=f7e40]: Шаг 03 · Команда
            - heading "Соберите отдел продаж в приложении" [level=3] [ref=f7e41]
            - paragraph [ref=f7e42]: Пригласите сотрудников, назначьте владельца объявления и контактное лицо — обращение приходит тому, кто за объект отвечает.
          - article [ref=f7e43]:
            - paragraph [ref=f7e44]: Шаг 04 · Обращения
            - heading "Вопрос приходит прямо из карточки объекта" [level=3] [ref=f7e45]
            - paragraph [ref=f7e46]: Сразу видно, о каком доме речь и кто смотрел объект. Ответственный ведёт диалог в чате с полной историей.
          - article [ref=f7e47]:
            - paragraph [ref=f7e48]: Шаг 05 · Сделка
            - heading "Доведите сделку до договора" [level=3] [ref=f7e49]
            - paragraph [ref=f7e50]: "Этапы, участники и документы — в одной сделке. Авторство риэлтора закреплено: спор «чей клиент» закрыт до его начала."
          - article [ref=f7e51]:
            - paragraph [ref=f7e52]: Шаг 06 · Канал сбыта
            - heading "Ваши объекты продают все риэлторы платформы" [level=3] [ref=f7e53]
            - paragraph [ref=f7e54]: "Не один-два партнёра, а все риэлторы «БАСТ»: они видят объявление и берут его в работу без предварительной договорённости — условия партнёрства и вознаграждение заданы в объявлении заранее. Просмотры, закрепления и репосты видны по каждому объекту."
