      - generic [ref=e21]: Застройщикам
      - heading "Продавайте объекты не одним риэлтором, а всеми" [level=1] [ref=e22]:
        - text: Продавайте объекты
        - generic [ref=e23]: не одним риэлтором, а всеми
      - paragraph [ref=e24]: Опубликуйте дома и подряды, задайте акции и вознаграждение — и объекты берут в работу все риэлторы платформы. Обращения, команда и сделки — в одном приложении.
    - generic [ref=e26]:
      - paragraph [ref=e28]: "Скрольте — путь застройщика: от публикации объявления до широкого канала сбыта."
      - generic [ref=e30]:
        - generic [ref=e31]:
          - article [ref=e32]:
            - paragraph [ref=e33]: Шаг 01 · Каталог
            - heading "Опубликуйте готовый дом или подряд" [level=3] [ref=e34]
            - paragraph [ref=e35]: "Мастер ведёт по шагам: характеристики, фото, планировки и 3D, материалы стен для подряда. Черновик сохраняется сам."
          - article [ref=e36]:
            - paragraph [ref=e37]: Шаг 02 · Акции
            - heading "Одна акция — сразу на несколько объявлений" [level=3] [ref=e38]
            - paragraph [ref=e39]: Создайте акцию — скидку или подарок — и примените её сразу к нескольким объектам. Покупатель и риэлтор видят её в карточке ещё до сделки.
          - article [ref=e40]:
            - paragraph [ref=e41]: Шаг 03 · Команда
            - heading "Соберите отдел продаж в приложении" [level=3] [ref=e42]
            - paragraph [ref=e43]: Пригласите сотрудников, назначьте владельца объявления и контактное лицо — обращение приходит тому, кто за объект отвечает.
          - article [ref=e44]:
            - paragraph [ref=e45]: Шаг 04 · Обращения
            - heading "Вопрос приходит прямо из карточки объекта" [level=3] [ref=e46]
            - paragraph [ref=e47]: Сразу видно, о каком доме речь и кто смотрел объект. Ответственный ведёт диалог в чате с полной историей.
          - article [ref=e48]:
            - paragraph [ref=e49]: Шаг 05 · Сделка
            - heading "Доведите сделку до договора" [level=3] [ref=e50]
            - paragraph [ref=e51]: "Этапы, участники и документы — в одной сделке. Авторство риэлтора закреплено: спор «чей клиент» закрыт до его начала."
          - article [ref=e52]:
            - paragraph [ref=e53]: Шаг 06 · Канал сбыта
            - heading "Ваши объекты продают все риэлторы платформы" [level=3] [ref=e54]
            - paragraph [ref=e55]: "Не один-два партнёра, а все риэлторы «БАСТ»: они видят объявление и берут его в работу без предварительной договорённости — условия партнёрства и вознаграждение заданы в объявлении заранее. Просмотры, закрепления и репосты видны по каждому объекту."
