# Nginx конфигурация для БАСТ Недвижимость
# Замените YOUR_SUBDOMAIN.YOUR_DOMAIN.ru на ваш поддомен

server {
    listen 80;
    server_name YOUR_SUBDOMAIN.YOUR_DOMAIN.ru;

    # Редирект на HTTPS (раскомментируйте после установки SSL)
    # return 301 https://$server_name$request_uri;

    root /var/www/bast-estate;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Основной роутинг для SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

